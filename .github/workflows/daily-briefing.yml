name: Daily News Briefing

on:
  # Disparado externamente a las 7 AM Chile via val.town (workflow_dispatch).
  # El cron de GitHub Actions fue removido por ser poco confiable en el plan gratuito.
  workflow_dispatch:

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide si corresponde correr este cron
        id: timecheck
        env:
          TZ: America/Santiago
          SCHEDULE: ${{ github.event.schedule }}
          EVENT:    ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Trigger manual: corremos sin chequeo."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OFFSET=$(date +%z)   # -0300 verano, -0400 invierno
          echo "Schedule: $SCHEDULE | Chile offset actual: $OFFSET"

          # Solo corre el cron que da las 07:00 Chile en la temporada actual.
          # Tolerante a delays de GitHub: la decisión depende del DST, no de la hora.
          if [ "$OFFSET" = "-0300" ] && [ "$SCHEDULE" = "0 10 * * *" ]; then
            echo "Verano DST (UTC-3): cron 10 UTC = 07:00 Chile. Run."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$OFFSET" = "-0400" ] && [ "$SCHEDULE" = "0 11 * * *" ]; then
            echo "Invierno (UTC-4): cron 11 UTC = 07:00 Chile. Run."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "Este cron no corresponde al DST actual. Skip para evitar duplicados."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.timecheck.outputs.skip != 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: steps.timecheck.outputs.skip != 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Run daily briefing
        if: steps.timecheck.outputs.skip != 'true' || github.event_name == 'workflow_dispatch'
        env:
          # Provider de IA: gemini (gratis), groq (gratis) u openai (pago).
          AI_PROVIDER:         ${{ vars.AI_PROVIDER || 'gemini' }}
          AI_MODEL:            ${{ vars.AI_MODEL || '' }}
          # Secrets por provider (solo configura el que uses)
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          NEWS_API_KEY:        ${{ secrets.NEWS_API_KEY }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:            ${{ secrets.EMAIL_TO }}
          TIMEZONE:            America/Santiago
          BRIEFING_LANG:       es
        run: npm start
